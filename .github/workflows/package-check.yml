name: Quality

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Lightweight compatibility check (the full one is for python 3.14 below)
  test-python:
    name: Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    uses: ./.github/workflows/reusable-python-validation.yml
    with:
      python_version: ${{ matrix.python-version }}

  package-check:
    name: Python 3.14
    # This is the canonical full check used for pull requests and master.
    uses: ./.github/workflows/reusable-python-validation.yml
    with:
      python_version: "3.14"
      full_check: true
      upload_coverage: true
      upload_docs: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
