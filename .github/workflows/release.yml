name: Release

on:
  # Publishing starts only from version-shaped tags such as 1.2.3 or 1.2.3rc1.
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

jobs:
  build:
    name: Validate and build release
    # Reuse the same gate as pull requests, adding tag verification and retained artifacts.
    uses: ./.github/workflows/reusable-python-validation.yml
    with:
      python_version: "3.14"
      full_check: true
      upload_distributions: true
      release_tag: ${{ github.ref_name }}

  artifact-smoke:
    name: Install ${{ matrix.name }} artifact
    # Never publish a distribution until every public install shape imports cleanly.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core wheel
            pattern: "*.whl"
            extra: ""
            import_package: qrobot
          - name: core sdist
            pattern: "*.tar.gz"
            extra: ""
            import_package: qrobot
          - name: model visualization
            pattern: "*.whl"
            extra: model-visualization
            import_package: qrobot
          - name: qUnits
            pattern: "*.whl"
            extra: qunits
            import_package: qrobot_qunits
          - name: visualization
            pattern: "*.whl"
            extra: visualization
            import_package: qrobot_visualization
          - name: simulator
            pattern: "*.whl"
            extra: simulator
            import_package: qrobot_simulator
          - name: dashboard
            pattern: "*.whl"
            extra: dashboard
            import_package: qrobot_dashboard
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Install and import artifact
        env:
          ARTIFACT_PATTERN: ${{ matrix.pattern }}
          EXTRA: ${{ matrix.extra }}
          IMPORT_PACKAGE: ${{ matrix.import_package }}
        run: |
          artifact=$(find dist -maxdepth 1 -name "$ARTIFACT_PATTERN" -print -quit)
          test -n "$artifact"
          if test -n "$EXTRA"; then
            python -m pip install "$artifact[$EXTRA]"
          else
            python -m pip install "$artifact"
          fi
          python -c "import $IMPORT_PACKAGE"

  publish-pypi:
    name: Publish to PyPI
    needs: artifact-smoke
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/quantum-robot
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Publish distributions with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - name: Create release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}"
          --verify-tag
          --generate-notes
          --title "quantum-robot ${{ github.ref_name }}"
