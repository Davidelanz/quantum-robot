coverage:
  status:
    # Component rules below define the meaningful gates for this multi-package project.
    project:
      default: false
    patch:
      default: false

component_management:
  # Individual packages report coverage; only the "supported" aggregate influences CI outcome.
  default_rules:
    statuses:
      - type: project
        target: auto
        informational: true
  individual_components:
    # Stable packages form the required aggregate reported on pull requests.
    - component_id: supported
      name: Supported packages
      paths:
        - src/qrobot/**
        - src/qrobot_qunits/**
        - src/qrobot_visualization/**
        - src/qrobot_dashboard/**
      statuses:
        - type: project
          target: auto
        - type: patch
          target: auto
    # Per-package components make regressions visible without failing experimental code.
    - component_id: qrobot
      paths: [src/qrobot/**]
    - component_id: qrobot_qunits
      paths: [src/qrobot_qunits/**]
    - component_id: qrobot_visualization
      paths: [src/qrobot_visualization/**]
    - component_id: qrobot_dashboard
      paths: [src/qrobot_dashboard/**]
    - component_id: qrobot_simulator
      paths: [src/qrobot_simulator/**]

comment:
  # Keep the pull-request comment compact while still showing package-level movement.
  layout: "header, diff, components"
