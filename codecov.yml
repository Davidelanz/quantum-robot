coverage:
  status:
    project:
      default: false
    patch:
      default: false

component_management:
  # Individual packages report coverage; only the "supported" aggregate influences CI outcome.
  default_rules:
    statuses:
      - type: project
        target: auto
        informational: true
  individual_components:
    - component_id: supported
      name: Supported packages
      paths:
        - src/qrobot/**
        - src/qrobot_qunits/**
        - src/qrobot_visualization/**
      statuses:
        - type: project
          target: auto
        - type: patch
          target: auto
    - component_id: qrobot
      paths: [src/qrobot/**]
    - component_id: qrobot_qunits
      paths: [src/qrobot_qunits/**]
    - component_id: qrobot_visualization
      paths: [src/qrobot_visualization/**]
    - component_id: qrobot_simulator
      paths: [src/qrobot_simulator/**]
    - component_id: qrobot_dashboard
      paths: [src/qrobot_dashboard/**]

comment:
  layout: "header, diff, components"
