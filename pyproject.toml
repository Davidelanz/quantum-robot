[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "quantum-robot"
version = "1.2.0"
description = "A set of Python modules for quantum-like perception modelling."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Davide Lanza", email = "info@davidelanza.it" }]
maintainers = [{ name = "Davide Lanza", email = "info@davidelanza.it" }]
keywords = ["quantum", "robotics", "modeling"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 3 - Alpha",
    "Natural Language :: English",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=2.3", "qiskit>=2.4.1,<3"]

[project.optional-dependencies]
model-visualization = ["matplotlib>=3.10", "pandas>=2.3", "seaborn>=0.13"]
qunits = ["redis>=4.3.4"]
visualization = [
    "matplotlib>=3.10",
    "networkx>=3.4",
    "plotly>=6.0",
    # visualization uses qUnits; include the same Redis client requirement:
    "redis>=4.3.4",
]
simulator = ["matplotlib>=3.10", "redis>=4.3.4"]
dashboard = [
    "dash>=3.0",
    "redis>=4.3.4",
    "matplotlib>=3.10",
    "networkx>=3.4",
    "plotly>=6.0",
]
test = [
    "pytest>=8.4",
    "pytest-check>=2.5",
    "pytest-cov>=7.0",
    "pytest-mock>=3.15",
    # Core model tests exercise the optional plotting API as a real feature.
    "matplotlib>=3.10",
    "pandas>=2.3",
    "seaborn>=0.13",
    "redis>=4.3.4",
    "networkx>=3.4",
    "plotly>=6.0",
    "dash>=3.0",
]
docs = [
    "ipykernel>=7.0",
    "jupytext>=1.17",
    "myst-nb>=1.3",
    "sphinx>=8.2",
    "sphinx-rtd-theme>=3.0",
    # Executed MyST tutorials generate model plots during the HTML build.
    "matplotlib>=3.10",
    "pandas>=2.3",
    "seaborn>=0.13",
    "redis>=4.3.4",
    "networkx>=3.4",
    "plotly>=6.0",
]
lint = [
    "black>=25.0",
    "build>=1.2",
    "jupytext>=1.17",
    "ruff>=0.14",
    "twine>=6.1",
]

[project.urls]
Homepage = "http://quantum-robot.org/"
Documentation = "http://docs.quantum-robot.org/"
Repository = "https://github.com/Davidelanz/quantum-robot"

[tool.poetry]
packages = [
    { include = "qrobot", from = "src" },
    { include = "qrobot_qunits", from = "src" },
    { include = "qrobot_visualization", from = "src" },
    { include = "qrobot_simulator", from = "src" },
    { include = "qrobot_dashboard", from = "src" },
]
include = [{ path = "tests", format = "sdist" }]

[tool.pytest.ini_options]
markers = [
    "redis: marks tests which need a redis db (deselect with '-m \"not redis\"')",
]

[tool.pylint.'MESSAGES CONTROL']
disable = ["too-few-public-methods", "logging-fstring-interpolation"]

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]

[tool.black]
line-length = 100

[tool.ruff]
target-version = "py311"
extend-exclude = ["docs/_build"]
line-length = 100

[tool.ruff.lint]
# Correctness checks and NumPy-style public API documentation.
select = ["D", "E4", "E7", "E9", "F"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"docs/**/*.py" = ["D"]
"examples/**/*.py" = ["D"]
"scripts/**/*.py" = ["D"]
"tests/**/*.py" = ["D"]

[tool.mypy]
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
explicit_package_bases = true
files = "src"
mypy_path = "src"
namespace_packages = true
show_error_codes = true
strict = true

[[tool.mypy.overrides]]
module = ["pandas", "plotly", "plotly.*", "qiskit", "qiskit.*", "seaborn"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["networkx"]
ignore_missing_imports = true

[tool.coverage.run]
relative_files = true
source = ["src"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]

[dependency-groups]
lint = ["mypy (>=2.3.1,<3.0.0)"]
