version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.14"
  apt_packages:
    - redis-server
  jobs:
    post_install:
      - python -m pip install poetry
      - python -m poetry config virtualenvs.create false --local
      - python -m poetry install --extras docs --extras model-visualization --extras qunits --extras visualization --extras dashboard
    pre_build:
      - redis-server --daemonize yes

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
