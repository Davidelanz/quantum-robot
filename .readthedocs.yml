version: 2

# Read the Docs uses its own isolated build, independent from GitHub Actions.
build:
  os: ubuntu-22.04
  tools:
    python: "3.14"
  apt_packages:
    # Executed qUnits examples need a real Redis daemon during the docs build.
    - redis-server
  jobs:
    post_install:
      - python -m pip install poetry
      # Attach Poetry to RTD's active environment rather than letting it
      # select or create a second one.
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH python -m poetry install --extras docs --extras model-visualization --extras qunits --extras visualization --extras dashboard
    # Replace RTD's default ``python -m sphinx`` job. The executable builder
    # refreshes the MyST tutorials and runs through Poetry's environment.
    build:
      html:
        - redis-server --daemonize yes
        - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH python -m poetry run python scripts/build_docs.py
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - cp -a docs/_build/html/. "$READTHEDOCS_OUTPUT/html/"

sphinx:
  configuration: docs/conf.py
  # Treat documentation warnings as regressions rather than silently publishing them.
  fail_on_warning: true
